# sms.adricore.co.ug — Angular SPA + reverse proxy to Spring Boot
#
# 1. Copy the production browser build:
#      Interface/dist/Interface/browser  →  /var/www/sms.adricore.co.ug
#    If the folder contains index.csr.html (SSR build) and no index.html:
#      cp index.csr.html index.html
# 2. Place this file in /etc/nginx/sites-available/sms.adricore.co.ug
#    and symlink it into sites-enabled.
# 3. Point DNS A/AAAA for sms.adricore.co.ug at this server.
# 4. Issue TLS (example):
#      certbot --nginx -d sms.adricore.co.ug
# 5. Run the Java API on 127.0.0.1:8080 (do not expose 8080 publicly).
#
# Frontend calls /api/v1/... on the same host; nginx forwards those to Spring Boot.

upstream adricore_sms_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sms.adricore.co.ug;

    # After certbot this block usually becomes a redirect to HTTPS.
    # Keep it until certificates exist so ACME HTTP-01 can succeed.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sms.adricore.co.ug;

    # certbot will replace these paths if you use --nginx
    ssl_certificate     /etc/letsencrypt/live/sms.adricore.co.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms.adricore.co.ug/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sms.adricore.co.ug;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API → Spring Boot (keeps /api/v1/... path)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_pass http://adricore_sms_api;
    }

    # Hashed Angular assets can be cached; index.html must not
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
