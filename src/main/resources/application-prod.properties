# Production overrides. Prefer environment variables from deploy/.env / run-api.sh.

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:adricore_messaging}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

app.portal-url=${APP_PORTAL_URL:https://sms.adricore.co.ug}

logging.level.web=INFO
logging.level.root=INFO

# Keep GCP off unless the host has credentials
spring.cloud.gcp.core.enabled=${GCP_ENABLED:false}
spring.cloud.gcp.storage.enabled=${GCP_ENABLED:false}
spring.cloud.gcp.secretmanager.enabled=${GCP_ENABLED:false}
spring.autoconfigure.exclude=com.google.cloud.spring.autoconfigure.secretmanager.GcpSecretManagerAutoConfiguration

# Africa's Talking configuration (set via environment)
africas-talking.api-key=${AFRICAS_TALKING_API_KEY:}
africas-talking.username=${AFRICAS_TALKING_USERNAME:}
africas-talking.sender-id=${AFRICAS_TALKING_SENDER_ID:Adricore}
africas-talking.api-url=${AFRICAS_TALKING_API_URL:https://api.africastalking.com/version1/messaging}
africas-talking.enabled=${AFRICAS_TALKING_ENABLED:true}
