<section class="login-shell">
  <div class="login-orb login-orb-navy" aria-hidden="true"></div>
  <div class="login-orb login-orb-teal" aria-hidden="true"></div>

  <div class="login-frame">
    <aside class="brand-panel">
      <div class="brand-copy">
        <div class="logo-plate">
          <img src="/assets/branding/adricore-logo.png" alt="Adricore Technologies" />
        </div>
        <p class="eyebrow">First sign-in</p>
        <h1>Replace the temporary password before you open the console.</h1>
      </div>
    </aside>

    <main class="form-panel">
      <div class="mobile-brand">
        <img src="/assets/branding/adricore-logo.png" alt="Adricore Technologies" />
      </div>

      <div class="form-card">
        <header>
          <p class="kicker">Security</p>
          <h2>Set your password</h2>
          <p class="lede">Use the temporary password from your email, then choose a new one with at least 8 characters.</p>
        </header>

        @if (error()) {
          <div class="alert" role="alert">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.3 4.7 2.8 18a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.7a2 2 0 0 0-3.4 0Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span>{{ error() }}</span>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <label class="field">
            <span>Temporary password</span>
            <input type="password" formControlName="currentPassword" autocomplete="current-password" />
            @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
              <small>Enter the password from your email.</small>
            }
          </label>
          <label class="field">
            <span>New password</span>
            <div class="password-wrap">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="newPassword"
                autocomplete="new-password"
                placeholder="At least 8 characters"
              />
              <button type="button" class="ghost-icon" (click)="togglePassword()" [attr.aria-pressed]="showPassword()">
                <span class="sr-only">{{ showPassword() ? 'Hide password' : 'Show password' }}</span>
                @if (showPassword()) {
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6A3 3 0 0 0 12 15a3 3 0 0 0 2.4-4.4M9.9 5.1A11 11 0 0 1 12 5c5 0 9.3 3.1 11 7-0.5 1.2-1.3 2.3-2.2 3.3M6.5 6.5C4.4 7.8 2.7 9.7 1 12c1.7 2.3 3.8 4.2 6.3 5.4A11 11 0 0 0 12 19c.7 0 1.4 0 2-.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                } @else {
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Zm10 3a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                }
              </button>
            </div>
            @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
              <small>Use at least 8 characters.</small>
            }
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
            @if (form.controls.confirmPassword.touched && form.controls.confirmPassword.hasError('mismatch')) {
              <small>Passwords do not match.</small>
            } @else if (form.controls.confirmPassword.touched && form.controls.confirmPassword.invalid) {
              <small>Confirm your new password.</small>
            }
          </label>
          <button class="submit" type="submit" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner" aria-hidden="true"></span>
              Saving
            } @else {
              Save and continue
            }
          </button>
        </form>
        <p class="switch">
          <button type="button" class="text-link" (click)="logout()">Sign out</button>
        </p>
      </div>
      <p class="legal">© {{ year }} Adricore Technologies. All rights reserved.</p>
    </main>
  </div>
</section>
